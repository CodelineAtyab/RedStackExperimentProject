name: CI Build

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  detect-changed-projects:
    name: Detect changed projects
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.detect.outputs.matrix }}
      has_changes: ${{ steps.detect.outputs.has_changes }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect changed Maven projects
        id: detect
        shell: bash
        run: |
          set -euo pipefail

          git fetch --no-tags origin "${{ github.base_ref }}"

          mapfile -t changed_files < <(git diff --name-only "origin/${{ github.base_ref }}...HEAD")

          declare -A projects=()
          for file in "${changed_files[@]}"; do
            [[ "$file" == experiments_area/*/*/* ]] || continue

            project_root="$(cut -d/ -f1-3 <<< "$file")"
            if [[ -f "$project_root/pom.xml" ]]; then
              projects["$project_root"]=1
            fi
          done

          if [[ ${#projects[@]} -eq 0 ]]; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "matrix=[]" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          matrix="$(
            printf '%s\n' "${!projects[@]}" \
              | sort \
              | jq -R -s -c 'split("\n") | map(select(length > 0) | {name: ., path: .})'
          )"

          echo "has_changes=true" >> "$GITHUB_OUTPUT"
          echo "matrix=${matrix}" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.project.name }}
    needs: detect-changed-projects
    if: needs.detect-changed-projects.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJSON(needs.detect-changed-projects.outputs.matrix) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'corretto'
          cache: 'maven'
          cache-dependency-path: ${{ matrix.project.path }}/pom.xml

      - name: Build with Maven
        working-directory: ${{ matrix.project.path }}
        shell: bash
        run: |
          if [[ -f ./mvnw ]]; then
            bash ./mvnw -B -ntp clean verify
          else
            mvn -B -ntp clean verify
          fi

  maven-build-result:
    name: Maven Build
    needs:
      - detect-changed-projects
      - build
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Check CI results
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
