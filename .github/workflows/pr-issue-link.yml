name: PR Issue Link

# Reads the issue number from the branch name (feature/<ticket-id>-<your-id>-<short-name>),
# adds "Closes #<id>" to the PR body and prefixes the title with "#<id>".
# pull_request_target is used so it also works for PRs from forks; this workflow
# never checks out or runs PR code, and PR data is only passed through env vars.
on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize]

permissions:
  pull-requests: write
  issues: write   # PR comments are issue comments
  contents: read

concurrency:
  group: pr-issue-link-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  link-issue:
    name: Link issue from branch name
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Add issue number to PR
        uses: actions/github-script@v7
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        with:
          script: |
            const pr = context.payload.pull_request;
            const headRef = process.env.HEAD_REF;
            const marker = '<!-- pr-issue-link-bot -->';
            const { owner, repo } = context.repo;
            const number = pr.number;

            // README rule: feature/<ticket-id>-<your-id>-<short-name>
            const match = /^feature\/(\d+)-([A-Za-z0-9][A-Za-z0-9_]*)-([A-Za-z0-9][A-Za-z0-9._-]*)$/.exec(headRef);

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number: number, per_page: 100,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));

            if (!match) {
              if (!existing) {
                await github.rest.issues.createComment({
                  owner, repo, issue_number: number,
                  body: `${marker}\nThe branch name \`${headRef.replace(/[`\r\n]/g, '')}\` does not follow the naming rule, so I could not link an issue automatically.\n\nExpected: \`feature/<ticket-id>-<your-id>-<short-name>\`, for example \`feature/64-alaa-weather-desk-converter\`.\n\nPlease see the branching steps in the README.`,
                });
              }
              core.warning('Branch name does not match feature/<ticket-id>-<your-id>-<short-name>.');
              return;
            }

            const id = match[1];
            const ref = new RegExp(`(^|[^\\w])#${id}(?!\\d)`);
            const updates = {};

            const body = pr.body || '';
            if (!ref.test(body)) {
              // Append, so existing text and the attribution lines at the top stay intact.
              updates.body = body.trimEnd() + (body.trim() ? '\n\n' : '') + `Closes #${id}`;
            }
            if (!new RegExp(`^#${id}(?!\\d)`).test(pr.title)) {
              updates.title = `#${id} ${pr.title}`;
            }

            if (Object.keys(updates).length === 0) {
              core.info('Nothing to change.');
              return;
            }
            await github.rest.pulls.update({ owner, repo, pull_number: number, ...updates });
            core.info(`Updated: ${Object.keys(updates).join(', ')}`);
